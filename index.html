<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Native Mobile PWA Settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030712">
  <link rel="manifest" href='data:application/manifest+json,{"name":"J.A.R.V.I.S. OS","short_name":"JARVIS","start_url":"./","display":"standalone","background_color":"#030712","theme_color":"#030712","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2097/2097276.png","sizes":"512x512","type":"image/png"}]}'>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2097/2097276.png">
  <title>J.A.R.V.I.S. Mobile Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #030712;
      color: #e0f2fe;
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
    }
    .orbitron { font-family: 'Orbitron', sans-serif; }
    .glow-cyan { box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); }
    .glow-text { text-shadow: 0 0 10px rgba(0, 240, 255, 0.7); }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 35px rgba(0, 240, 255, 0.8); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .reactor-active {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">

  <!-- Top Pinned Mobile API Bar -->
  <header class="w-full bg-slate-900/90 backdrop-blur-md border border-cyan-500/40 p-3 rounded-xl shadow-lg flex flex-col gap-2">
    <div class="flex items-center justify-between">
      <span class="orbitron text-cyan-400 font-bold text-sm tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-microchip animate-pulse"></i> J.A.R.V.I.S. OS
      </span>
      <span id="statusBadge" class="text-xs px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">
        Needs API Key
      </span>
    </div>
    <div class="flex gap-2">
      <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key" 
             class="flex-1 bg-slate-950 border border-cyan-500/50 rounded-lg px-3 py-2 text-xs text-cyan-300 focus:outline-none focus:border-cyan-400">
      <button id="saveKeyBtn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-lg transition-all active:scale-95">
        SAVE
      </button>
    </div>
  </header>

  <!-- Central Arc Reactor Core -->
  <main class="flex-1 flex flex-col items-center justify-center my-8 text-center">
    <div id="arcReactor" class="w-44 h-44 rounded-full border-4 border-cyan-400/80 bg-slate-900/80 flex items-center justify-center cursor-pointer transition-all duration-300 glow-cyan relative active:scale-90">
      <div class="w-32 h-32 rounded-full border-2 border-dashed border-cyan-300 flex items-center justify-center bg-cyan-950/30">
        <div class="w-20 h-20 rounded-full bg-cyan-500/20 border border-cyan-400 flex items-center justify-center">
          <i id="micIcon" class="fa-solid fa-microphone text-4xl text-cyan-400 glow-text"></i>
        </div>
      </div>
    </div>
    
    <p id="instructionText" class="mt-6 text-sm text-cyan-300/80 orbitron tracking-wide px-4">
      TAP ARC REACTOR TO ENGAGE
    </p>
    <p id="liveTranscript" class="mt-2 text-xs text-slate-400 italic min-h-[20px] px-4">
      "Awaiting speech input..."
    </p>
  </main>

  <!-- Terminal Output Window -->
  <footer class="w-full bg-slate-950/90 border border-slate-800 rounded-xl p-3 text-left">
    <div class="flex items-center justify-between mb-1 pb-1 border-b border-slate-800">
      <span class="text-[10px] orbitron text-slate-400 uppercase tracking-wider">System Output</span>
      <span class="text-[10px] text-cyan-500/70" id="latencyDisplay">0 ms</span>
    </div>
    <div id="terminalLog" class="text-xs text-cyan-200 font-mono h-24 overflow-y-auto leading-relaxed space-y-1">
      <p class="text-slate-500">> System initialized. Ready for user input.</p>
    </div>
  </footer>

  <script>
  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const statusBadge = document.getElementById('statusBadge');
    const arcReactor = document.getElementById('arcReactor');
    const micIcon = document.getElementById('micIcon');
    const instructionText = document.getElementById('instructionText');
    const liveTranscript = document.getElementById('liveTranscript');
    const terminalLog = document.getElementById('terminalLog');
    const latencyDisplay = document.getElementById('latencyDisplay');

    let isListening = false;
    let recognition = null;
    let torchTrack = null; // Native Flashlight Hardware Track

    // Load saved API key on startup
    const savedKey = localStorage.getItem('GEMINI_API_KEY');
    if (savedKey) {
      apiKeyInput.value = savedKey;
      updateStatus(true);
    }

    saveKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('GEMINI_API_KEY', key);
        updateStatus(true);
        log('> GEMINI API Key stored successfully.', 'text-green-400');
        speak("API Key configured. Direct device hardware control initialized, Sir.");
      } else {
        localStorage.removeItem('GEMINI_API_KEY');
        updateStatus(false);
        log('> GEMINI API Key cleared.', 'text-yellow-400');
      }
    });

    function updateStatus(active) {
      if (active) {
        statusBadge.textContent = 'CORE ONLINE';
        statusBadge.className = 'text-xs px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/40';
      } else {
        statusBadge.textContent = 'NEEDS API KEY';
        statusBadge.className = 'text-xs px-2 py-0.5 rounded-full bg-yellow-500/20 text-yellow-300 border border-yellow-500/40';
      }
    }

    function log(msg, colorClass = 'text-cyan-200') {
      const p = document.createElement('p');
      p.className = colorClass;
      p.textContent = msg;
      terminalLog.appendChild(p);
      terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // --- NATIVE HARDWARE CONTROLS (MADE BY US, 100% FREE) ---

    // 1. Native Camera Torch / Flashlight Control
    async function toggleFlashlight(turnOn) {
      try {
        if (turnOn) {
          if (!torchTrack) {
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { exact: 'environment' } }
            });
            torchTrack = stream.getVideoTracks()[0];
          }
          await torchTrack.applyConstraints({ advanced: [{ torch: true }] });
          log('> [HARDWARE]: Flashlight turned ON', 'text-yellow-300');
        } else {
          if (torchTrack) {
            await torchTrack.applyConstraints({ advanced: [{ torch: false }] });
            torchTrack.stop();
            torchTrack = null;
          }
          log('> [HARDWARE]: Flashlight turned OFF', 'text-yellow-300');
        }
      } catch (err) {
        log(`> Torch Error: ${err.message}`, 'text-red-400');
      }
    }

    // 2. Native Android Intent App Launcher
    function launchNativeAction(action, detail = '') {
      const target = (detail || '').toLowerCase();

      // Haptic Vibration feedback
      if ('vibrate' in navigator) navigator.vibrate(200);

      if (action === 'flashlight_on') toggleFlashlight(true);
      else if (action === 'flashlight_off') toggleFlashlight(false);
      else if (action === 'open_app') {
        if (target.includes('whatsapp')) window.location.href = 'whatsapp://';
        else if (target.includes('youtube')) window.location.href = 'https://youtube.com';
        else if (target.includes('map') || target.includes('navigation')) window.location.href = 'https://maps.google.com';
        else if (target.includes('camera')) window.location.href = 'intent://com.android.camera/#Intent;scheme=launch;package=com.android.camera;end';
        else if (target.includes('clock') || target.includes('alarm')) window.location.href = 'intent://com.android.deskclock/#Intent;scheme=launch;package=com.android.deskclock;end';
        else if (target.includes('setting')) window.location.href = 'intent:#Intent;action=android.settings.SETTINGS;end';
        else window.location.href = `https://www.google.com/search?q=${encodeURIComponent(detail)}`;
      } else if (action === 'set_alarm') {
        window.location.href = 'intent://com.android.deskclock/#Intent;scheme=launch;package=com.android.deskclock;end';
      }
    }

    // --- GEMINI AI & VOICE LOGIC WITH FUNCTION CALLING ---
    const systemTools = [{
      functionDeclarations: [{
        name: "control_phone",
        description: "Executes hardware actions directly on the user's phone.",
        parameters: {
          type: "OBJECT",
          properties: {
            action: { 
              type: "STRING", 
              description: "Action type: 'flashlight_on', 'flashlight_off', 'open_app', 'set_alarm'" 
            },
            detail: { 
              type: "STRING", 
              description: "App name (e.g., 'WhatsApp', 'YouTube', 'Settings', 'Camera') or alarm details." 
            }
          },
          required: ["action"]
        }
      }]
    }];

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        arcReactor.classList.add('reactor-active');
        micIcon.className = 'fa-solid fa-waveform text-4xl text-cyan-300 animate-bounce';
        instructionText.textContent = 'LISTENING...';
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        liveTranscript.textContent = `"${transcript}"`;

        if (event.results[0].isFinal) {
          processUserPrompt(transcript);
        }
      };

      recognition.onerror = (e) => {
        log(`> Mic Error: ${e.error}`, 'text-red-400');
        stopListening();
      };

      recognition.onend = () => { stopListening(); };
    }

    function stopListening() {
      isListening = false;
      arcReactor.classList.remove('reactor-active');
      micIcon.className = 'fa-solid fa-microphone text-4xl text-cyan-400 glow-text';
      instructionText.textContent = 'TAP ARC REACTOR TO ENGAGE';
    }

    arcReactor.addEventListener('click', () => {
      const key = localStorage.getItem('GEMINI_API_KEY');
      if (!key) {
        log('> Error: Enter and save your Gemini API Key first.', 'text-yellow-400');
        speak("Please enter your API key at the top first.");
        return;
      }
      if (isListening) recognition.stop();
      else recognition.start();
    });

    async function processUserPrompt(promptText) {
      const apiKey = localStorage.getItem('GEMINI_API_KEY');
      if (!apiKey) return;

      log(`> User: ${promptText}`, 'text-white font-bold');
      instructionText.textContent = 'EXECUTING...';
      const startTime = Date.now();

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `You are J.A.R.V.I.S., a phone controller. If the user asks to turn on/off flashlight, open apps, set alarms, or adjust settings, invoke 'control_phone'. Otherwise reply in 1 short spoken sentence. Request: ${promptText}`
              }]
            }],
            tools: systemTools
          })
        });

        const data = await response.json();
        latencyDisplay.textContent = `${Date.now() - startTime} ms`;

        const candidate = data.candidates?.[0]?.content?.parts?.[0];

        if (candidate?.functionCall) {
          const args = candidate.functionCall.args;
          log(`> Executing: ${args.action} ${args.detail ? '(' + args.detail + ')' : ''}`, 'text-yellow-300 font-bold');
          launchNativeAction(args.action, args.detail);
          const reply = `Executing ${args.action.replace('_', ' ')} now, Sir.`;
          log(`> JARVIS: ${reply}`, 'text-cyan-300');
          speak(reply);
        } else if (candidate?.text) {
          const aiReply = candidate.text.trim();
          log(`> JARVIS: ${aiReply}`, 'text-cyan-300');
          speak(aiReply);
        }
      } catch (err) {
        log(`> Request Failed: ${err.message}`, 'text-red-400');
      } finally {
        instructionText.textContent = 'TAP ARC REACTOR TO ENGAGE';
      }
    }
  </script>
  </script>
</body>
</html>
