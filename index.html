<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NIKYA // MULTILINGUAL TERMINAL</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030804">
  <link rel="manifest" href='data:application/manifest+json,{"name":"NIKYA OS","short_name":"NIKYA","start_url":"./","display":"standalone","background_color":"#030804","theme_color":"#030804","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/2097/2097276.png","sizes":"512x512","type":"image/png"}]}'>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2097/2097276.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #030804;
      color: #00ff66;
      font-family: 'Fira Code', monospace;
      touch-action: manipulation;
    }
    .mono-font { font-family: 'Share Tech Mono', monospace; }
    .glow-green { box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); }
    .glow-text { text-shadow: 0 0 10px rgba(0, 255, 102, 0.8); }
    .border-hacker { border-color: rgba(0, 255, 102, 0.35); }
    
    @keyframes pulse-hacker {
      0% { transform: scale(0.96); opacity: 0.85; box-shadow: 0 0 15px rgba(0, 255, 102, 0.3); }
      50% { transform: scale(1.04); opacity: 1; box-shadow: 0 0 35px rgba(0, 255, 102, 0.9); }
      100% { transform: scale(0.96); opacity: 0.85; box-shadow: 0 0 15px rgba(0, 255, 102, 0.3); }
    }
    .core-active {
      animation: pulse-hacker 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 max-w-md mx-auto relative overflow-x-hidden">

  <!-- Header Panel -->
  <header class="w-full bg-black/90 border border-hacker p-3 rounded-lg shadow-lg flex flex-col gap-2 z-10">
    <div class="flex items-center justify-between">
      <span class="mono-font text-emerald-400 font-bold text-sm tracking-widest flex items-center gap-2 glow-text">
        <i class="fa-solid fa-terminal animate-pulse"></i> NIKYA_CORE // OPENAI
      </span>
      <span id="statusBadge" class="text-[10px] px-2 py-0.5 rounded border border-yellow-500/50 bg-yellow-950/40 text-yellow-400 font-mono">
        NO_KEY
      </span>
    </div>

    <!-- Controls -->
    <div class="flex gap-2">
      <select id="langSelect" class="bg-zinc-950 border border-emerald-600/60 rounded px-2 py-1 text-xs text-emerald-300 focus:outline-none font-mono">
        <option value="ur-PK">Urdu / Roman Urdu (پاکستان)</option>
        <option value="en-US">English (US)</option>
        <option value="ar-SA">Arabic (العربية)</option>
      </select>
      <input type="password" id="apiKeyInput" placeholder="> OpenAI Key (sk-...)" 
             class="flex-1 bg-zinc-950 border border-emerald-600/60 rounded px-2.5 py-1 text-xs text-emerald-300 focus:outline-none focus:border-emerald-400 font-mono placeholder-emerald-800">
      <button id="saveKeyBtn" class="bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs px-3 py-1 rounded transition-all active:scale-95 mono-font">
        [SAVE]
      </button>
    </div>
  </header>

  <!-- Central Core -->
  <main class="flex-1 flex flex-col items-center justify-center my-6 text-center">
    <div id="arcReactor" class="w-44 h-44 rounded-full border-2 border-emerald-500/70 bg-zinc-950 flex items-center justify-center cursor-pointer transition-all duration-300 glow-green relative active:scale-90">
      <div class="w-32 h-32 rounded-full border border-dashed border-emerald-400/60 flex items-center justify-center bg-emerald-950/20">
        <div class="w-20 h-20 rounded-full bg-emerald-500/10 border border-emerald-400 flex items-center justify-center">
          <i id="micIcon" class="fa-solid fa-code text-3xl text-emerald-400 glow-text"></i>
        </div>
      </div>
    </div>
    
    <p id="instructionText" class="mt-6 text-xs text-emerald-400 mono-font tracking-widest px-2 glow-text">
      SYSTEM READY // TAP CORE TO ENGAGE NIKYA
    </p>
    <p id="liveTranscript" class="mt-2 text-[11px] text-zinc-500 italic min-h-[18px] px-2 font-mono">
      > awaiting vocal input...
    </p>
  </main>

  <!-- Console Log -->
  <footer class="w-full bg-black border border-emerald-800/80 rounded-lg p-3 text-left font-mono">
    <div class="flex items-center justify-between mb-1 pb-1 border-b border-emerald-900/80">
      <span class="text-[10px] text-emerald-500 uppercase tracking-widest">[CONSOLE_LOG]</span>
      <span class="text-[10px] text-emerald-600" id="latencyDisplay">0ms</span>
    </div>
    <div id="terminalLog" class="text-[11px] text-emerald-400 h-28 overflow-y-auto leading-relaxed space-y-1">
      <p class="text-emerald-700">> root@nikya:~# system initialized (OpenAI Engine).</p>
    </div>
  </footer>

  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const langSelect = document.getElementById('langSelect');
    const statusBadge = document.getElementById('statusBadge');
    const arcReactor = document.getElementById('arcReactor');
    const micIcon = document.getElementById('micIcon');
    const instructionText = document.getElementById('instructionText');
    const liveTranscript = document.getElementById('liveTranscript');
    const terminalLog = document.getElementById('terminalLog');
    const latencyDisplay = document.getElementById('latencyDisplay');

    let isListening = false;
    let recognition = null;
    let torchTrack = null;

    function getApiKey() {
      const stored = localStorage.getItem('OPENAI_API_KEY');
      if (stored && stored.trim() !== "") return stored.trim();
      return null;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const activeKey = getApiKey();
      if (activeKey) {
        apiKeyInput.value = activeKey;
        updateStatus('AI_ONLINE', 'emerald');
        log('> [SYSTEM]: OpenAI Engine ready.', 'text-emerald-400');
      } else {
        updateStatus('NO_KEY', 'yellow');
        log('> [!] Paste OpenAI key (starts with sk-) above & tap [SAVE].', 'text-yellow-400');
      }
    });

    saveKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (key.startsWith('sk-')) {
        localStorage.setItem('OPENAI_API_KEY', key);
        updateStatus('AI_ONLINE', 'emerald');
        log('> [OK]: OpenAI Key saved.', 'text-emerald-300');
        speak("Key saved. System online.");
      } else {
        log('> [WARN]: OpenAI keys must start with sk-...', 'text-yellow-400');
        speak("Invalid key format. OpenAI keys start with s k.");
      }
    });

    function updateStatus(text, color) {
      statusBadge.textContent = text;
      statusBadge.className = `text-[10px] px-2 py-0.5 rounded border border-${color}-500/60 bg-${color}-950/60 text-${color}-300 font-mono`;
    }

    function log(msg, colorClass = 'text-emerald-400') {
      const p = document.createElement('p');
      p.className = colorClass;
      p.textContent = msg;
      terminalLog.appendChild(p);
      terminalLog.scrollTop = terminalLog.scrollHeight;
    }

    // Speech Engine
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.pitch = 1.0; 
      utterance.rate = 1.0;

      const selectedLang = langSelect.value;
      if (selectedLang.startsWith('ur') || /karo|chalao|band|khol|batao/i.test(text)) {
        utterance.lang = 'ur-PK';
      } else if (selectedLang.startsWith('ar')) {
        utterance.lang = 'ar-SA';
      } else {
        utterance.lang = 'en-US';
      }

      const voices = window.speechSynthesis.getVoices();
      let matchedVoice = voices.find(v => v.lang.replace('_','-').toLowerCase() === utterance.lang.toLowerCase()) ||
                         voices.find(v => v.lang.startsWith(utterance.lang.substring(0,2)));
                         
      if (!matchedVoice && utterance.lang.startsWith('ur')) {
        matchedVoice = voices.find(v => v.lang.startsWith('hi'));
      }

      if (matchedVoice) utterance.voice = matchedVoice;
      window.speechSynthesis.speak(utterance);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // Hardware Controls
    async function toggleFlashlight(turnOn) {
      try {
        if (turnOn) {
          if (!torchTrack) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'environment' } } });
            torchTrack = stream.getVideoTracks()[0];
          }
          await torchTrack.applyConstraints({ advanced: [{ torch: true }] });
          log('> [HARDWARE]: Flashlight ON.', 'text-yellow-300 font-bold');
        } else {
          if (torchTrack) {
            await torchTrack.applyConstraints({ advanced: [{ torch: false }] });
            torchTrack.stop();
            torchTrack = null;
          }
          log('> [HARDWARE]: Flashlight OFF.', 'text-yellow-300 font-bold');
        }
      } catch (err) {
        log(`> Hardware Error: ${err.message}`, 'text-red-400');
      }
    }

    function launchNativeAction(action, detail = '') {
      const target = (detail || '').toLowerCase();
      if ('vibrate' in navigator) navigator.vibrate(150);

      if (action === 'flashlight_on') toggleFlashlight(true);
      else if (action === 'flashlight_off') toggleFlashlight(false);
      else if (action === 'open_app') {
        if (target.includes('whatsapp')) window.location.href = 'whatsapp://';
        else if (target.includes('youtube')) window.location.href = 'https://youtube.com';
        else if (target.includes('map')) window.location.href = 'https://maps.google.com';
        else window.location.href = `https://www.google.com/search?q=${encodeURIComponent(detail)}`;
      }
    }

    // Offline Commands
    function processLocalCommands(text) {
      const t = text.toLowerCase();

      if ((t.includes('flashlight') || t.includes('torch') || t.includes('لاٹ')) && (t.includes('on') || t.includes('chalao') || t.includes('karo') || t.includes('jalat') || t.includes('تشغيل'))) {
        launchNativeAction('flashlight_on');
        const reply = langSelect.value.startsWith('ur') ? "فلیش لائٹ آن کر دی گئی ہے۔" : "Flashlight turned on.";
        log(`> Nikya (Local): ${reply}`, 'text-emerald-300');
        speak(reply);
        return true;
      }
      if ((t.includes('flashlight') || t.includes('torch') || t.includes('لاٹ')) && (t.includes('off') || t.includes('band') || t.includes('bujhao') || t.includes('إيقاف'))) {
        launchNativeAction('flashlight_off');
        const reply = langSelect.value.startsWith('ur') ? "فلیش لائٹ بند کر دی گئی ہے۔" : "Flashlight turned off.";
        log(`> Nikya (Local): ${reply}`, 'text-emerald-300');
        speak(reply);
        return true;
      }
      return false;
    }

    // Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        arcReactor.classList.add('core-active');
        micIcon.className = 'fa-solid fa-terminal text-3xl text-emerald-300 animate-pulse';
        instructionText.textContent = 'NIKYA LISTENING...';
        log(`> [MIC]: Active (${langSelect.value})...`, 'text-emerald-500');
      };

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        liveTranscript.textContent = `> "${transcript}"`;

        if (event.results[0].isFinal) {
          processUserPrompt(transcript);
        }
      };

      recognition.onerror = (e) => {
        log(`> Speech Mic Error: ${e.error}`, 'text-red-400');
        stopListening();
      };

      recognition.onend = () => { stopListening(); };
    }

    function stopListening() {
      isListening = false;
      arcReactor.classList.remove('core-active');
      micIcon.className = 'fa-solid fa-code text-3xl text-emerald-400 glow-text';
      instructionText.textContent = 'SYSTEM READY // TAP CORE TO ENGAGE NIKYA';
    }

    arcReactor.addEventListener('click', () => {
      if (isListening) {
        recognition.stop();
      } else {
        recognition.lang = langSelect.value;
        recognition.start();
      }
    });

    async function processUserPrompt(promptText) {
      log(`> User: ${promptText}`, 'text-white font-bold');
      
      if (processLocalCommands(promptText)) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        log('> [ERR]: Paste OpenAI API Key (starts with sk-)', 'text-yellow-400');
        speak("Please enter your OpenAI API key above.");
        return;
      }

      instructionText.textContent = 'PROCESSING OPENAI...';
      const startTime = Date.now();

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              {
                role: 'system',
                content: 'You are Nikya AI voice assistant. Respond in 1 short spoken sentence in the exact same language/dialect as the prompt (Urdu, Roman Urdu, Arabic, English).'
              },
              { role: 'user', content: promptText }
            ],
            max_tokens: 100,
            temperature: 0.6
          })
        });

        const data = await response.json();
        latencyDisplay.textContent = `${Date.now() - startTime}ms`;

        if (!response.ok || data.error) {
          log(`> [OPENAI ERROR]: ${data.error?.message || 'Authentication error'}`, 'text-red-400');
          speak("API authentication error.");
          return;
        }

        const aiReply = data.choices?.[0]?.message?.content?.trim();
        if (aiReply) {
          log(`> Nikya: ${aiReply}`, 'text-emerald-300');
          speak(aiReply);
        }
      } catch (err) {
        log(`> Network Error: ${err.message}`, 'text-red-400');
      } finally {
        instructionText.textContent = 'SYSTEM READY // TAP CORE TO ENGAGE NIKYA';
      }
    }
  </script>
</body>
</html>
