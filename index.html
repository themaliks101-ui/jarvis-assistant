<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>NIKYA // OPENROUTER AI</title>

  <meta name="theme-color" content="#030804">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link
    rel="icon"
    type="image/png"
    href="https://cdn-icons-png.flaticon.com/512/2097/2097276.png"
  >

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <!-- Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #030804;
      color: #00ff66;
      font-family: "Fira Code", monospace;
      touch-action: manipulation;
    }

    .mono {
      font-family: "Share Tech Mono", monospace;
    }

    .glow {
      box-shadow:
        0 0 15px rgba(0, 255, 102, 0.35),
        0 0 35px rgba(0, 255, 102, 0.15);
    }

    .text-glow {
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
    }

    .core-active {
      animation: pulseCore 1.2s infinite ease-in-out;
    }

    @keyframes pulseCore {
      0% {
        transform: scale(0.96);
        box-shadow: 0 0 15px rgba(0,255,102,.35);
      }

      50% {
        transform: scale(1.05);
        box-shadow:
          0 0 30px rgba(0,255,102,.8),
          0 0 70px rgba(0,255,102,.25);
      }

      100% {
        transform: scale(0.96);
        box-shadow: 0 0 15px rgba(0,255,102,.35);
      }
    }

    .scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .scrollbar::-webkit-scrollbar-thumb {
      background: #064e3b;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="min-h-screen max-w-md mx-auto p-3 flex flex-col">

  <!-- HEADER -->
  <header
    class="bg-black/90 border border-emerald-500/40 rounded-xl p-3 shadow-lg"
  >

    <div class="flex items-center justify-between">

      <div
        class="mono text-emerald-400 font-bold text-sm tracking-widest text-glow"
      >
        <i class="fa-solid fa-terminal mr-1"></i>
        NIKYA_CORE // OPENROUTER
      </div>

      <div
        id="statusBadge"
        class="text-[10px] px-2 py-1 rounded border border-yellow-500/50 bg-yellow-950/30 text-yellow-400"
      >
        NO_KEY
      </div>

    </div>

    <!-- LANGUAGE -->
    <div class="mt-3">

      <select
        id="langSelect"
        class="w-full bg-zinc-950 border border-emerald-600/60 rounded-lg px-3 py-2 text-xs text-emerald-300 outline-none"
      >
        <option value="ur-PK">
          Urdu / Roman Urdu
        </option>

        <option value="en-US">
          English
        </option>

        <option value="ar-SA">
          Arabic
        </option>
      </select>

    </div>

    <!-- API KEY -->
    <div class="mt-2 flex gap-2">

      <input
        id="apiKeyInput"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="sk-or-v1-..."
        class="flex-1 min-w-0 bg-zinc-950 border border-emerald-600/60 rounded-lg px-3 py-2 text-xs text-emerald-300 outline-none focus:border-emerald-300"
      >

      <button
        id="saveKeyBtn"
        type="button"
        class="bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs px-4 rounded-lg active:scale-95"
      >
        SAVE
      </button>

    </div>

    <div class="flex gap-2 mt-2">

      <button
        id="showKeyBtn"
        type="button"
        class="flex-1 border border-emerald-800 rounded-lg py-1.5 text-[10px] text-emerald-500"
      >
        SHOW / HIDE KEY
      </button>

      <button
        id="clearKeyBtn"
        type="button"
        class="flex-1 border border-red-900 rounded-lg py-1.5 text-[10px] text-red-400"
      >
        CLEAR KEY
      </button>

    </div>

  </header>


  <!-- MAIN CORE -->
  <main class="flex-1 flex flex-col items-center justify-center py-8">

    <button
      id="arcReactor"
      type="button"
      class="w-48 h-48 rounded-full border-2 border-emerald-500/70 bg-zinc-950 flex items-center justify-center glow transition-all active:scale-90"
    >

      <div
        class="w-36 h-36 rounded-full border border-dashed border-emerald-400/60 flex items-center justify-center"
      >

        <div
          class="w-24
